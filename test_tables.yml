tables:
  # Tabela com tipos corretos (caso de sucesso)
  valid_table:
    table_path: catalogo.schema.valid_table
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer
        required: true
        metadata:
          descricao: "Identificador único"
          categoria: "Chave"
      - name: name
        type: string
        required: true
        metadata:
          descricao: "Nome do registro"
          categoria: "Informação"
      - name: active
        type: boolean
        metadata:
          descricao: "Status de ativação"
          categoria: "Status"
      - name: value
        type: integer
        metadata:
          descricao: "Valor inteiro"
          categoria: "Métrica"
      - name: created_at
        type: timestamp
        metadata:
          descricao: "Data de criação"
          categoria: "Temporal"
      - name: metadata
        type: struct
        metadata:
          descricao: "Metadados estruturados"
          categoria: "Configuração"

  # Tabela com todos os tipos de dados para teste
  types_table:
    table_path: catalogo.schema.types_table
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: string_col
        type: string
        metadata:
          descricao: "Campo string"
      - name: int_col
        type: integer
        metadata:
          descricao: "Campo inteiro"
      - name: long_col
        type: long
        metadata:
          descricao: "Campo long"
      - name: float_col
        type: float
        metadata:
          descricao: "Campo float"
      - name: double_col
        type: double
        metadata:
          descricao: "Campo double"
      - name: decimal_col
        type: decimal
        metadata:
          descricao: "Campo decimal"
      - name: bool_col
        type: boolean
        metadata:
          descricao: "Campo booleano"
      - name: date_col
        type: date
        metadata:
          descricao: "Campo data"
      - name: timestamp_col
        type: timestamp
        metadata:
          descricao: "Campo timestamp"
      - name: array_col
        type: array
        metadata:
          descricao: "Campo array"
      - name: map_col
        type: map
        metadata:
          descricao: "Campo map"
      - name: struct_col
        type: struct
        metadata:
          descricao: "Campo struct"