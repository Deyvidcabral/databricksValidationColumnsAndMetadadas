tables:
  # Tabela que não existe (para testar validação de existência)
  nonexistent_table:
    table_path: catalogo.schema.nonexistent
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer
        required: true

  # Tabela com tipos corretos (caso de sucesso)
  valid_table:
    table_path: catalogo.schema.valid_table
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer
        required: true
        metadata:
          descricao: "Identificador único"
          categoria: "Chave"
      - name: name
        type: string
        required: true
        metadata:
          descricao: "Nome do registro"
          categoria: "Informação"
      - name: active
        type: boolean
        metadata:
          descricao: "Status de ativação"
          categoria: "Status"
      - name: value
        type: integer
        metadata:
          descricao: "Valor inteiro"
          categoria: "Métrica"
      - name: created_at
        type: timestamp
        metadata:
          descricao: "Data de criação"
          categoria: "Temporal"
      - name: metadata
        type: struct
        metadata:
          descricao: "Metadados estruturados"
          categoria: "Configuração"
      - name: tags
        type: array
        metadata:
          descricao: "Lista de tags"
          categoria: "Classificação"

  # Tabela com colunas faltando
  missing_columns_table:
    table_path: catalogo.schema.missing_columns
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer
        required: true
        metadata:
          descricao: "Identificador único"
          categoria: "Chave"
      - name: nome
        type: string
        required: true  # Esta coluna está faltando nos dados
        metadata:
          descricao: "Nome do registro"
          categoria: "Informação"
      - name: valor
        type: double
        required: false
        metadata:
          descricao: "Valor do registro"
          categoria: "Métrica"
      - name: data
        type: string
        required: false
        metadata:
          descricao: "Data do registro"
          categoria: "Temporal"

  # Tabela com tipos incompatíveis
  wrong_types_table:
    table_path: catalogo.schema.wrong_types
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer  # Na tabela está como string
        required: true
        metadata:
          descricao: "Identificador único"
          categoria: "Chave"
      - name: nome
        type: string
        required: true
        metadata:
          descricao: "Nome do registro"
          categoria: "Informação"
      - name: valor
        type: double  # Na tabela está como string
        required: true
        metadata:
          descricao: "Valor do registro"
          categoria: "Métrica"
      - name: ativo
        type: boolean  # Na tabela está como string
        required: true
        metadata:
          descricao: "Status de ativação"
          categoria: "Status"

  # Tabela com tipos complexos
  complex_types_table:
    table_path: catalogo.schema.complex_types
    metadata:
      product: "TACIA"
      data_owner: "teste@exemplo.com"
      nivel_compartilhamento: "publico"
    columns:
      - name: id
        type: integer
        required: true
        metadata:
          descricao: "Identificador único"
          categoria: "Chave"
      - name: metadata
        type: struct
        required: true
        metadata:
          descricao: "Metadados estruturados"
          categoria: "Configuração"
      - name: tags
        type: array
        required: true
        metadata:
          descricao: "Lista de tags"
          categoria: "Classificação"
      - name: config
        type: struct
        required: true
        metadata:
          descricao: "Configurações estruturadas"
          categoria: "Configuração"
      - name: scores
        type: array
        required: true
        metadata:
          descricao: "Lista de pontuações"
          categoria: "Métrica"